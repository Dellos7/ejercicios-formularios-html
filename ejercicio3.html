<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario registro</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="cabecera">
        <a href="index.html">
          <button class="volver">Volver</button>
        </a>
        <h1>Regístrate</h1>
      </div>

    <form action="http://localhost/ejercicios-formularios-php/ejercicio3.php" method="post" id="formulario-registro">
    <!-- MAC -->
    <!-- <form action="http://localhost:8888/ejercicios-formularios-php/ejercicio3.php" method="post" id="formulario-registro">    -->
        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre" required>
    
        <label for="apellidos">Apellidos:</label>
        <input type="text" name="apellidos" required>
    
        <label for="correo">Correo:</label>
        <input type="email" name="correo" required>
        
        <label for="fecha_nacimiento">Fecha de nacimiento:</label>
        <input type="date" name="fecha_nacimiento" required>

        <label for="usuario">Nombre de usuario:</label>
        <input type="text" name="usuario" required>

        <label for="rol">Rol:</label>
        <select name="rol" required>
            <option value="profesor">Profesor</option>
            <option value="alumno">Alumno</option>
        </select>

        <label for="color_favorito">Color favorito:</label>
        <input type="color" name="color_favorito" required>

        <label for="contraseña">Contraseña:</label>
        <input type="password" name="contraseña" required pattern=".{8,}">

        <label for="contraseña_repetir">Repite la contraseña:</label>
        <input type="password" name="contraseña_repetir" required>

        <button id="enviar" type="submit">Enviar</button>
    </form>

    <script>
        let formulario = document.getElementById("formulario-registro");
        formulario.onsubmit = function(event){
            let contraseña = document.getElementsByName("contraseña")[0].value;
            let contraseñaRepetir = document.getElementsByName("contraseña_repetir")[0].value;
            console.log(contraseña, contraseñaRepetir);
            if( contraseña != contraseñaRepetir ){
                alert("Las contraseñas no coinciden");
                event.preventDefault();
            }
        }
    </script>

</body>
</html>
