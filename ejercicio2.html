<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperatura</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="cabecera">
    <a href="index.html">
      <button class="volver">Volver</button>
    </a>
    <h1>Ejercicio 2</h1>
  </div>
  <!-- <form action="https://davidlopezcastellote.com/ejercicios-formularios-php/ejercicio2.php" method="post"> -->
    <form action="http://localhost/ejercicios-formularios-php/ejercicio2.php" method="post">  
    <label for="temperatura">Temperatura:</label>
    <input name="slider_temp" id="slider_temp" type="range" min="-100" max="100" value="0">
    <label id="valor_temp"></label>
    <button type="submit">Convertir</button>
  </form>

  <script>
    var slider = document.getElementById("slider_temp");
    var label = document.getElementById("valor_temp");
    label.innerHTML = slider.value + "ºC"; // Display the default slider value

    // Update the current slider value (each time you drag the slider handle)
    slider.oninput = function() {
      label.innerHTML = this.value + "ºC";
    }
  </script>

</body>
</html>
